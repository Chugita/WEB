<!doctype html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#05050b"><meta name="description" content="Sinapsis Orgánica. Una exploración de tus decisiones y lo que querés construir."><title>Sinapsis Orgánica</title></head>
<body>
  <main id="experience">
    <div id="origin" aria-label="Sinapsis Orgánica, recorrido interactivo">
      <div id="scene" aria-hidden="true"></div>
      <div id="fallback" aria-hidden="true"><svg viewBox="0 0 600 600"><defs><radialGradient id="dense"><stop stop-color="#f7dfbd"/><stop offset=".3" stop-color="#c6aebd"/><stop offset=".68" stop-color="#9989b3"/><stop offset="1" stop-color="#4e435f"/></radialGradient></defs><path d="M118 190C149 106 244 93 302 110C377 55 442 126 450 191C531 239 486 332 470 371C460 473 372 498 307 463C221 505 155 438 145 385C61 342 69 240 118 190Z" fill="url(#dense)"/></svg></div>
      <div id="matter-touch-zone" aria-hidden="true"></div>
      <p id="scroll-hint">Deslizá para descubrir<span aria-hidden="true"></span></p>
      <button id="advance" class="sr-only focus-control" type="button">Avanzar a la primera pregunta</button>
      <button id="motion-toggle" class="sr-only focus-control" type="button">Pausar movimiento</button>
      <section id="junction" aria-labelledby="question" hidden>
        <h1 id="question" tabindex="-1">Si pensaras en los próximos años, ¿qué te gustaría conseguir?</h1>
        <div role="group" aria-labelledby="question">
          <button class="answer-orb" data-answer="project" aria-pressed="false" type="button">Concretar un proyecto</button>
          <button class="answer-orb" data-answer="stability" aria-pressed="false" type="button">Tener mayor estabilidad</button>
          <button class="answer-orb" data-answer="independence" aria-pressed="false" type="button">Tener más independencia</button>
        </div>
        <button id="return" class="sr-only focus-control" type="button">Volver al origen</button>
      </section>
      <span id="status" class="sr-only" role="status" aria-live="polite"></span>
    </div>
    <div id="scroll-space" aria-hidden="true"></div>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
