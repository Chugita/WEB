<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#05060c">
  <meta name="description" content="Sinapsis Orgánica. Toda decisión tiene un origen. Una experiencia de planificación financiera interactiva.">
  <title>Sinapsis Orgánica — El origen</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preload" as="image" href="assets/neural-origin-v2.png">
  <script src="app.js" defer></script>
</head>
<body>
  <div class="neural-field" aria-hidden="true"></div>
  <canvas id="origin" aria-hidden="true"></canvas>
  <div class="vignette" aria-hidden="true"></div>
  <header>
    <a class="brand" href="./" aria-label="Sinapsis Orgánica, inicio"><svg viewBox="0 0 34 34" aria-hidden="true"><path d="M17 17 7 6M17 17 29 10M17 17 23 30M17 17 4 24"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="6" r="1.5"/><circle cx="29" cy="10" r="1.5"/><circle cx="23" cy="30" r="1.5"/><circle cx="4" cy="24" r="1.5"/></svg><span>SINAPSIS<span class="brand-sub">ORGÁNICA</span></span></a>
    <button class="quiet" id="skip">Omitir intro <span aria-hidden="true">↗</span></button>
  </header>
  <main id="main" class="intro">
    <section class="opening" aria-labelledby="headline">
      <h1 id="headline">Toda decisión<br>tiene un origen.</h1>
      <div class="origin-rule" aria-hidden="true"></div>
      <button id="begin" class="begin">Comenzar <span aria-hidden="true">⟶</span></button>
    </section>
    <p id="status" class="sr-only" role="status"></p>
  </main>
  <footer><span class="descriptor">PLANIFICACIÓN FINANCIERA INTERACTIVA</span><div class="controls"><button id="pause" class="quiet">Pausar movimiento</button><button id="replay" class="quiet" hidden><span aria-hidden="true">↺</span> Repetir intro</button></div></footer>
  <noscript><style>.opening{opacity:1;transform:none;visibility:visible}.neural-field{opacity:1}.begin{opacity:1;visibility:visible}#skip,#pause{display:none}</style></noscript>
</body>
</html>
